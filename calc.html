<html>
<head>
	<title>calculator</title>
	<link rel="stylesheet" href="calc.css">
	<script>
		var storednumber=0;
		var operator='';
		var currentnumber=0;

		function handleOperator(op) {
			if (operator=='') {
				storednumber=currentnumber;
				document.getElementById('nftext').innerHTML=storednumber;
			}
			else if (operator=='+') {
				storednumber+=currentnumber;

				document.getElementById('nftext').innerHTML=storednumber;
			}

			else if (operator=='-') {
				storednumber-=currentnumber;
				document.getElementById('nftext').innerHTML=storednumber;
			}
			else if (operator=='*') {
				storednumber*=currentnumber;
				document.getElementById('nftext').innerHTML=storednumber;
			}
			else if (operator=='/') {
				storednumber/=currentnumber;
				document.getElementById('nftext').innerHTML=storednumber;
			}

			else if (operator=='=') {
				storednumber=currentnumber;
				document.getElementById('nftext').innerHTML=storednumber;
			}
			currentnumber=0;
			operator=op;
		}

		  
	</script>
</head>
